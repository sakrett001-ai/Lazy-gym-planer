name: Publish checked planner release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-candidate.yml'
      - 'src/**'
      - 'i18n/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'build.js'
      - 'floot/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: lazy-gym-production
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v6
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/prototypes/bench-lab/package-lock.json
      - name: Install dependencies
        working-directory: source
        run: |
          npm ci
          npm ci --prefix prototypes/bench-lab
      - name: Install browser for the English interface audit
        working-directory: source
        run: npx playwright install --with-deps chromium
      - name: Check and build
        working-directory: source
        run: npm run check:all
      - name: Build immutable Floot release
        working-directory: source
        run: npm run build:floot
      - uses: actions/checkout@v6
        if: github.event_name != 'pull_request'
        with:
          ref: gh-pages
          path: site
      - name: Publish checked release and preserve existing previews
        if: github.event_name != 'pull_request'
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          cd site
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" != "$SOURCE_COMMIT" ]; then
            echo "A newer main commit exists; this older build will not be published." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd ..
          cp -R source/dist/. site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Проверенный релиз из $SOURCE_COMMIT"
          fi
          git push origin HEAD:refs/heads/gh-pages
          {
            echo "Published source: $SOURCE_COMMIT"
            echo "Release commit: $(git rev-parse HEAD)"
            echo "GitHub Pages and Floot now use this checked release."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Request GitHub Pages build after the token-authenticated push
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/pages/builds', {
              owner: context.repo.owner,
              repo: context.repo.repo
            });
